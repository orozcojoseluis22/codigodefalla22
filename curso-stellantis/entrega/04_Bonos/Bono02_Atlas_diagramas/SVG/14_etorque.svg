<text x="40" y="744" font-family="Barlow, Arial, sans-serif" font-size="14" font-weight="500" fill="#C9CED4" text-anchor="start">Ilustración didáctica de elaboración propia, proporciones aproximadas. Siga siempre el procedimiento de seguridad del fabricante.</text>
