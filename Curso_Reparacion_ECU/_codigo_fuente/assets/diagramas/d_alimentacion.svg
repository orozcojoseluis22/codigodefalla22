/text><text x="40" y="732" font-family="'Barlow', Arial, sans-serif" font-size="15" font-weight="500" fill="#8A929B" text-anchor="start">Valores típicos; verificar con tarjeta buena del mismo número de parte  ·  Diagrama didáctico simplificado · Electrónica y Servicio</text></svg>