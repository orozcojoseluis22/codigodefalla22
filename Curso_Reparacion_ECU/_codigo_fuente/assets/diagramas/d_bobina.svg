10" fill="#FFF6D6" stroke="#C99400" stroke-width="2.5"/><text x="890" y="529.52" font-family="'Barlow Condensed', Arial, sans-serif" font-size="22" font-weight="700" fill="#2B3036" text-anchor="middle">ECM: driver de señal</text><text x="890" y="557.48" font-family="'Barlow', Arial, sans-serif" font-size="16" font-weight="500" fill="#2B3036" text-anchor="middle">Pulso lógico de bajo voltaje</text><text x="890" y="576.36" font-family="'Barlow', Arial, sans-serif" font-size="16" font-weight="500" fill="#2B3036" text-anchor="middle">(no maneja la corriente del primario)</text><path d="M930 465 L950 465 L950 440 L980 440 L980 465 L1000 465" fill="none" stroke="#2D7FF9" stroke-width="3" stroke-linejoin="round"/><text x="600" y="700" font-family="'Barlow', Arial, sans-serif" font-size="18" font-weight="600" fill="#E5484D" text-anchor="middle">Antes de reinstalar: mide primarios y secundarios; un corto en la bobina daña el driver de la computadora.</text><text x="40" y="732" font-family="'Barlow', Arial, sans-serif" font-size="15" font-weight="500" fill="#8A929B" text-anchor="start">Verificar arquitectura en el diagrama del motor; valores típicos  ·  Diagrama didáctico simplificado · Electrónica y Servicio</text></svg>