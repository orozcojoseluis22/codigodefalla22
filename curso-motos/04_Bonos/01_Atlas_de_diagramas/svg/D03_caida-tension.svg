="M900 530 L900 700" stroke="#1E2227" stroke-width="9"/><text x="915" y="620" font-family="'Barlow', Arial, sans-serif" font-size="15" font-weight="600" fill="#1E2227" text-anchor="start">Carcasa a bloque</text><circle cx="520" cy="210" r="38" fill="#fff" stroke="#2D7FF9" stroke-width="4"/><text x="520" y="222" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="34" font-weight="800" fill="#2D7FF9" text-anchor="middle">V</text><g><rect x="465" y="257" width="110" height="26" rx="13" fill="#EAF2FF" stroke="#2D7FF9" stroke-width="1.5"/><text x="520" y="275.5" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="600" fill="#2D7FF9" text-anchor="middle">V1 &lt; 0.5 V</text></g><path d="M482 210 L155 210 L155 330" fill="none" stroke="#2D7FF9" stroke-width="2" stroke-dasharray="6 6"/><path d="M558 210 L960 210 L960 410" fill="none" stroke="#2D7FF9" stroke-width="2" stroke-dasharray="6 6"/><circle cx="155" cy="330" r="7" fill="#2D7FF9"/><circle cx="960" cy="410" r="7" fill="#2D7FF9"/><circle cx="470" cy="600" r="38" fill="#fff" stroke="#2D7FF9" stroke-width="4"/><text x="470" y="612" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="34" font-weight="800" fill="#2D7FF9" text-anchor="middle">V</text><g><rect x="415" y="647" width="110" height="26" rx="13" fill="#EAF2FF" stroke="#2D7FF9" stroke-width="1.5"/><text x="470" y="665.5" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="600" fill="#2D7FF9" text-anchor="middle">V2 &lt; 0.5 V</text></g><path d="M432 600 L350 600 L350 425 L241 425" fill="none" stroke="#2D7FF9" stroke-width="2" stroke-dasharray="6 6"/><path d="M508 600 L700 600 L700 700" fill="none" stroke="#2D7FF9" stroke-width="2" stroke-dasharray="6 6"/><circle cx="700" cy="700" r="7" fill="#2D7FF9"/><circle cx="241" cy="425" r="7" fill="#2D7FF9"/><text x="60" y="900" font-family="'Barlow', Arial, sans-serif" font-size="17" font-weight="600" fill="#2B3036" text-anchor="start">Mide mientras das marcha 3 segundos: el voltímetro muestra</text><text x="60" y="922" font-family="'Barlow', Arial, sans-serif" font-size="17" font-weight="600" fill="#2B3036" text-anchor="start">lo que se pierde en el cable.</text><rect x="1190" y="116" width="370" height="780" rx="14" fill="#F4F5F7" stroke="#D5DADF" stroke-width="2"/><text x="1210" y="156" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="24" font-weight="800" fill="#2B3036" text-anchor="start" letter-spacing="1">PUNTOS DE PRUEBA</text><g><rect x="1210" y="177" width="40" height="34" rx="17" fill="#FFC20E" stroke="#1E2227" stroke-width="2.5"/><text x="1230" y="200.5" font-family="'IBM Plex Mono', monospace" font-size="16" font-weight="700" fill="#1E2227" text-anchor="middle">V1</text></g><text x="1210" y="232" font-family="'Barlow', Arial, sans-serif" font-size="16" font-weight="600" fill="#1E2227" text-anchor="start">Positivo: borne + batería →</text><text x="1210" y="252" font-family="'Barlow', Arial, sans-serif" font-size="16" font-weight="600" fill="#1E2227" text-anchor="start">borne del motor de arranque</text><text x="1210" y="276" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="500" fill="#2D7FF9" text-anchor="start">&lt; 0.5 V al dar marcha (criterio</text><text x="1210" y="296" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="500" fill="#2D7FF9" text-anchor="start">práctico)</text><g><rect x="1210" y="321" width="40" height="34" rx="17" fill="#FFC20E" stroke="#1E2227" stroke-width="2.5"/><text x="1230" y="344.5" font-family="'IBM Plex Mono', monospace" font-size="16" font-weight="700" fill="#1E2227" text-anchor="middle">V2</text></g><text x="1210" y="376" font-family="'Barlow', Arial, sans-serif" font-size="16" font-weight="600" fill="#1E2227" text-anchor="start">Tierra: bloque del motor →</text><text x="1210" y="396" font-family="'Barlow', Arial, sans-serif" font-size="16" font-weight="600" fill="#1E2227" text-anchor="start">borne − batería</text><text x="1210" y="420" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="500" fill="#2D7FF9" text-anchor="start">&lt; 0.5 V al dar marcha (criterio</text><text x="1210" y="440" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="500" fill="#2D7FF9" text-anchor="start">práctico)</text><text x="1210" y="836" font-family="'Barlow', Arial, sans-serif" font-size="14" font-weight="500" fill="#5B636B" text-anchor="start">El voltímetro se conecta en los</text><text x="1210" y="855" font-family="'Barlow', Arial, sans-serif" font-size="14" font-weight="500" fill="#5B636B" text-anchor="start">extremos del mismo tramo mientras</text><text x="1210" y="874" font-family="'Barlow', Arial, sans-serif" font-size="14" font-weight="500" fill="#5B636B" text-anchor="start">circula corriente (dando marcha).</text></svg>