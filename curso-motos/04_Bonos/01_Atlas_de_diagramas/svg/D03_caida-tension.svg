<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 L0 0 0 40" fill="none" stroke="#EEF0F2" stroke-width="1.5"/></pattern></defs><rect width="1600" height="1000" fill="#fff"/><rect y="96" width="1600" height="844" fill="url(#g)"/><rect width="1600" height="96" fill="#1E2227"/><rect width="14" height="96" fill="#FFC20E"/><text x="40" y="36" font-family="'IBM Plex Mono', monospace" font-size="17" font-weight="600" fill="#FFC20E" text-anchor="start" letter-spacing="1">ATLAS MOTODIAGRAMA · D03 · CLASE 1</text><text x="40" y="76" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="38" font-weight="800" fill="#fff" text-anchor="start">Prueba de caída de tensión en el circuito de arranque</text><rect y="940" width="1600" height="60" fill="#EEF0F2"/><rect y="940" width="1600" height="4" fill="#FFC20E"/><text x="40" y="976" font-family="'Barlow', Arial, sans-serif" font-size="16" font-weight="500" fill="#3A424A" text-anchor="start">Diagrama didáctico de un sistema típico · colores y valores de referencia: verifica siempre con el diagrama y el manual del fabricante.</text><text x="1560" y="976" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="22" font-weight="800" fill="#2B3036" text-anchor="end">Electrónica y Servicio</text><rect x="120" y="470" width="150" height="96" rx="8" fill="#2B3036" stroke="#1E2227" stroke-width="3"/><rect x="142" y="456" width="26" height="14" fill="#C9CED4" stroke="#1E2227" stroke-width="2"/><rect x="222" y="456" width="26" height="14" fill="#C9CED4" stroke="#1E2227" stroke-width="2"/><text x="155" y="500" font-family="'Barlow', Arial, sans-serif" font-size="30" font-weight="800" fill="#E5484D" text-anchor="middle">+</text><text x="235" y="500" font-family="'Barlow', Arial, sans-serif" font-size="30" font-weight="800" fill="#fff" text-anchor="middle">−</text><text x="195" y="542"