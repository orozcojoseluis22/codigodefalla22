  <text x="60" y="300" font-family="Barlow, Arial, sans-serif" font-size="17" font-weight="800" fill="#E5484D" text-anchor="start">Antes de intervenir:</text><text x="60" y="326" font-family="Barlow, Arial, sans-serif" font-size="16" font-weight="600" fill="#1E2227" text-anchor="start">1. Procedimiento de</text><text x="60" y="348" font-family="Barlow, Arial, sans-serif" font-size="16" font-weight="600" fill="#1E2227" text-anchor="start">desconexión del fabricante</text><text x="60" y="374" font-family="Barlow, Arial, sans-serif" font-size="16" font-weight="600" fill="#1E2227" text-anchor="start">2. Herramienta aislada</text><text x="60" y="400" font-family="Barlow, Arial, sans-serif" font-size="16" font-weight="600" fill="#1E2227" text-anchor="start">3. Verificar ausencia</text><text x="60" y="422" font-family="Barlow, Arial, sans-serif" font-size="16" font-weight="600" fill="#1E2227" text-anchor="start">de voltaje</text>
