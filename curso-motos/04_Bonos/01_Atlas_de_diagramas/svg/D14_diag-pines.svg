chor="start">≈ 0 Ω</text><rect x="580" y="436" width="580" height="84" rx="10" fill="#fff" stroke="#D5DADF" stroke-width="2"/><text x="600" y="486" font-family="'IBM Plex Mono', monospace" font-size="18" font-weight="700" fill="#1E2227" text-anchor="start">K-line</text><text x="740" y="486" font-family="'Barlow', Arial, sans-serif" font-size="17" font-weight="600" fill="#1E2227" text-anchor="start">Voltaje en reposo</text><text x="950" y="472" font-family="'Barlow', Arial, sans-serif" font-size="17" font-weight="600" fill="#2D7FF9" text-anchor="start">Cercano al de</text><text x="950" y="492" font-family="'Barlow', Arial, sans-serif" font-size="17" font-weight="600" fill="#2D7FF9" text-anchor="start">batería</text><rect x="580" y="528" width="580" height="84" rx="10" fill="#F4F5F7" stroke="#D5DADF" stroke-width="2"/><text x="600" y="578" font-family="'IBM Plex Mono', monospace" font-size="18" font-weight="700" fill="#1E2227" text-anchor="start">CAN H</text><text x="740" y="578" font-family="'Barlow', Arial, sans-serif" font-size="17" font-weight="600" fill="#1E2227" text-anchor="start">Voltaje, llave ON</text><text x="950" y="564" font-family="'Barlow', Arial, sans-serif" font-size="17" font-weight="600" fill="#2D7FF9" text-anchor="start">≈ 2.5 V (sube al</text><text x="950" y="584" font-family="'Barlow', Arial, sans-serif" font-size="17" font-weight="600" fill="#2D7FF9" text-anchor="start">comunicar)</text><rect x="580" y="620" width="580" height="84" rx="10" fill="#fff" stroke="#D5DADF" stroke-width="2"/><text x="600" y="670" font-family="'IBM Plex Mono', monospace" font-size="18" font-weight="700" fill="#1E2227" text-anchor="start">CAN L</text><text x="740" y="670" font-family="'Barlow', Arial, sans-serif" font-size="17" font-weight="600" fill="#1E2227" text-anchor="start">Voltaje, llave ON</text><text x="950" y="656" font-family="'Barlow', Arial, sans-serif" font-size="17" font-weight="600" fill="#2D7FF9" text-anchor="start">≈ 2.5 V (baja al</text><text x="950" y="676" font-family="'Barlow', Arial, sans-serif" font-size="17" font-weight="600" fill="#2D7FF9" text-anchor="start">comunicar)</text><rect x="580" y="712" width="580" height="84" rx="10" fill="#F4F5F7" stroke="#D5DADF" stroke-width="2"/><text x="600" y="762" font-family="'IBM Plex Mono', monospace" font-size="18" font-weight="700" fill="#1E2227" text-anchor="start">Sin uso</text><text x="740" y="762" font-family="'Barlow', Arial, sans-serif" font-size="17" font-weight="600" fill="#1E2227" text-anchor="start">Nada</text><text x="950" y="748" font-family="'Barlow', Arial, sans-serif" font-size="17" font-weight="600" fill="#2D7FF9" text-anchor="start">0 V y sin</text><text x="950" y="768" font-family="'Barlow', Arial, sans-serif" font-size="17" font-weight="600" fill="#2D7FF9" text-anchor="start">continuidad</text><rect x="1190" y="116" width="370" height="780" rx="14" fill="#F4F5F7" stroke="#D5DADF" stroke-width="2"/><text x="1210" y="156" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="24" font-weight="800" fill="#2B3036" text-anchor="start" letter-spacing="1">PUNTOS DE PRUEBA</text><g><rect x="1210" y="177" width="69" height="34" rx="17" fill="#FFC20E" stroke="#1E2227" stroke-width="2.5"/><text x="1244.5" y="200.5" font-family="'IBM Plex Mono', monospace" font-size="16" font-weight="700" fill="#1E2227" text-anchor="middle">+12 V</text></g><text x="1210" y="232" font-family="'Barlow', Arial, sans-serif" font-size="16" font-weight="600" fill="#1E2227" text-anchor="start">Voltaje con llave ON</text><text x="1210" y="256" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="500" fill="#2D7FF9" text-anchor="start">≈ voltaje de batería</text><g><rect x="1210" y="281" width="80" height="34" rx="17" fill="#FFC20E" stroke="#1E2227" stroke-width="2.5"/><text x="1250" y="304.5" font-family="'IBM Plex Mono', monospace" font-size="16" font-weight="700" fill="#1E2227" text-anchor="middle">Tierra</text></g><text x="1210" y="336" font-famil