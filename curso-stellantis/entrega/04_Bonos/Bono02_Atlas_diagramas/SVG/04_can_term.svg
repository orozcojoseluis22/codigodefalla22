  <g><rect x="380" y="420" width="120" height="40" rx="8" fill="#2FB344"/><text x="440" y="447" font-family="Barlow, Arial, sans-serif" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">≈ 60 Ω</text><text x="520" y="447" font-family="Barlow, Arial, sans-serif" font-size="18" font-weight="600" fill="#1E2227" text-anchor="start">Normal: dos terminaciones en paralelo</text></g><g><rect x="380" y="472" width="120" height="40" rx="8" fill="#FFC20E"/><text x="440" y="499" font-family="Barlow, Arial, sans-serif" font-size="20" font-weight="800" fill="#1E2227" text-anchor="middle">≈ 120 Ω</text><text x="520" y="499" font-family="Barlow, Arial, sans-serif" font-size="18" font-weight="600" fill="#1E2227" text-anchor="start">Falta una terminación o hay un tramo abierto</text></g><g><rect x="380" y="524" width="120" height="40" rx="8" fill="#E5484D"/><text x="440" y="551" font-family="Barlow, Arial, sans-serif" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">≈ 0 Ω</text><text x="520" y="551" font-family="Barlow, Arial, sans-serif" font-size="18" font-weight="600" fill="#1E2227" text-anchor="start">CAN H en corto con CAN L</text></g><g><rect x="380" y="576" width="120" height="40" rx="8" fill="#E5484D"/><text x="440" y="603" font-family="Barlow, Arial, sans-serif" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">OL</text><text x="520" y="603" font-family="Barlow, Arial, sans-serif" font-size="18" font-weight="600" fill="#1E2227" text-anchor="start">Circuito abierto en el punto medido</text></g>
  <text x="80" y="545" font-family="Barlow, Arial, sans-serif" font-size="17" font-weight="800" fill="#1E2227" text-anchor="start">Voltaje (encendido ON):</text><text x="80" y="570" font-family="Barlow, Arial, sans-serif" font-size="16" font-weight="600" fill="#1E2227" text-anchor="start">CAN H ≈ 2.6 V</text><text x="80" y="593" font-family="Barlow, Arial, sans-serif" font-size="16" font-weight="600" fill="#1E2227" text-anchor="start">CAN L ≈ 2.4 V (promedio)</text><text x="80" y="616" font-family="Barlow, Arial, sans-serif" font-size="16" font-weight="600" fill="#1E2227" text-anchor="start">≈0 V corto a tierra</text><text x="80" y="639" font-family="Barlow, Arial, sans-serif" font-size="16" font-weight="600" fill="#1E2227" text-anchor="start">≈12 V corto a B+</text>
