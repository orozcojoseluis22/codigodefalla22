" font-family="Barlow, Arial, sans-serif" font-size="18" font-weight="600" fill="#1E2227" text-anchor="start">CAN C alta (CAN H) – diagnóstico</text></g><g><rect x="120" y="558" width="34" height="30" rx="6" fill="#2FB344"/><text x="137" y="579" font-family="Barlow, Arial, sans-serif" font-size="16" font-weight="800" fill="#1E2227" text-anchor="middle">14</text><text x="166" y="580" font-family="Barlow, Arial, sans-serif" font-size="18" font-weight="600" fill="#1E2227" text-anchor="start">CAN C baja (CAN L) – diagnóstico</text></g><g><rect x="620" y="558" width="34" height="30" rx="6" fill="#E0A800"/><text x="637" y="579" font-family="Barlow, Arial, sans-serif" font-size="16" font-weight="800" fill="#1E2227" text-anchor="middle">3</text><text x="666" y="580" font-family="Barlow, Arial, sans-serif" font-size="18" font-weight="600" fill="#1E2227" text-anchor="start">CAN IHS / CAN B (+) según el modelo</text></g><g><rect x="120" y="602" width="34" height="30" rx="6" fill="#2FB344"/><text x="137" y="623" font-family="Barlow, Arial, sans-serif" font-size="16" font-weight="800" fill="#1E2227" text-anchor="middle">11</text><text x="166" y="624" font-family="Barlow, Arial, sans-serif" font-size="18" font-weight="600" fill="#1E2227" text-anchor="start">CAN IHS / CAN B (−) según el modelo</text></g><text x="120" y="660" font-family="Barlow, Arial, sans-serif" font-size="17" font-weight="700" fill="#1E2227" text-anchor="start">Prueba rápida: 16 = 12.4–12.8 V · 4 y 5 = menos de 0.1 V a negativo · 6–14 ≈ 60 Ω con batería desconectada</text>
